name: Shadow Client Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Extract source
        run: |
          unzip -q ShadowClient-1.21.11-source.zip -d .
          test -f ShadowClient/build.gradle

      - name: Build mod
        working-directory: ShadowClient
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ShadowClient-JAR
          path: ShadowClient/build/libs/*.jar
          if-no-files-found: error
